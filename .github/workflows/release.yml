name: Build and create release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Package build artifact
        run: zip -r "spora-leuven-${GITHUB_REF_NAME}.zip" dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: spora-leuven-${{ github.ref_name }}
          path: spora-leuven-${{ github.ref_name }}.zip

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "spora-leuven-${GITHUB_REF_NAME}.zip" --generate-notes --verify-tag